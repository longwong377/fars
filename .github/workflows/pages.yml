# s15/ship (D-374, UD-31): the public site https://longwong377.github.io/fars/, built by GitHub Actions from git alone (the
# Vagon desktop is not permanent: nothing built there is uploaded). Pages source = GitHub Actions (set by the user).
# The guards, lint and tsc run in guards.yml; this job only builds and deploys (tools/deploy/build_site.mjs).
name: pages
on:
  push:
    branches: [s14-int]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node tools/deploy/build_site.mjs
        env:
          PARSA_BASE: /fars/
          NODE_OPTIONS: --max-old-space-size=8192
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
