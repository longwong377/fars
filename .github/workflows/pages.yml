# s15/ship (D-368, UD-31): the public site https://longwong377.github.io/fars/, built by GitHub Actions from git alone (the
# Vagon desktop is not permanent: nothing built there is uploaded). Pages source should be GitHub Actions (see the deploy job).
# The guards, lint and tsc run in guards.yml; this job only builds and deploys (tools/deploy/build_site.mjs).
name: pages
on:
  push:
    branches: [s14-int]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node tools/deploy/build_site.mjs
        env:
          PARSA_BASE: /fars/
          NODE_OPTIONS: --max-old-space-size=8192
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Measured 2026-10-02: the repo's Pages source is still "deploy from a branch" (s14-int): GitHub's own Jekyll run
      # ("pages build and deployment") deploys the raw source tree on the same push and, finishing ~8 s after this job,
      # replaced the built site (the URL served /src/main.ts). Until the source is switched to GitHub Actions (Settings >
      # Pages > Source), wait for that run of this commit to finish and deploy last. With the source switched it never runs.
      - name: wait for the branch deploy of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50" --jq '[.workflow_runs[] | select(.name=="pages build and deployment" and .status!="completed")] | length')
            echo "branch deploys still running: $n"; [ "$n" = "0" ] && break; sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v4
